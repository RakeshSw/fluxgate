<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FluxGate Demo</title><style>body{font:17px system-ui;max-width:740px;margin:6vh auto;padding:0 20px;color:#1b2c44}button{background:#2058ce;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}pre{background:#edf3fc;padding:18px;border-radius:10px;white-space:pre-wrap}</style></head><body>
<h1>FluxGate demonstration</h1><p>All data in this page is synthetic. In the FluxGate extension, select <b>Load demo rule → Start</b>, then reload products. The <code>products[0].name</code> field should become blank only in this browser.</p><button id="reload">Reload products</button><h2>Product rendered by UI</h2><p id="product">Not loaded</p><h2>Observed JSON</h2><pre id="json"></pre>
<script>async function reload(){try{const res=await fetch('/api/products?time='+Date.now());const data=await res.json();document.getElementById('product').textContent=JSON.stringify(data.products[0].name);document.getElementById('json').textContent=JSON.stringify(data,null,2);}catch(e){document.getElementById('product').textContent='Error: '+e.message}}document.getElementById('reload').addEventListener('click',reload);reload();</script></body></html>
